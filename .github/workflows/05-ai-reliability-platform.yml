name: 05 - AI reliability platform

# Monorepo workflow: runs only when this project (or this file) changes.
# Release: push a tag like ai-reliability-platform-v0.1.0 to publish the image to GHCR.
on:
  push:
    branches: [main]
    tags: ["ai-reliability-platform-v*.*.*"]
    paths:
      - "projects/05-ai-reliability-platform/**"
      - ".github/workflows/05-ai-reliability-platform.yml"
  pull_request:
    paths:
      - "projects/05-ai-reliability-platform/**"
      - ".github/workflows/05-ai-reliability-platform.yml"

permissions:
  contents: read

concurrency:
  group: ai-reliability-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/05-ai-reliability-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tooling
        run: pip install ruff pyyaml
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate config files (rules, dashboards, k8s hardening)
        run: python scripts/validate_configs.py
      - name: Validate compose file
        run: docker compose config -q

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/05-ai-reliability-platform/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase the repository for registry references
        # Registry paths must be lowercase; github.repository keeps its case ("Joxejaime/...").
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image (loaded locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: projects/05-ai-reliability-platform
          load: true
          tags: ai-reliability-gateway:ci
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        # Trivy runs from its pinned container image: one less third-party action in the supply
        # chain, an explicit scanner version, and the DB mirror can be retried when it rate-limits.
        run: |
          TRIVY=aquasec/trivy:0.57.1
          mkdir -p .trivycache
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivycache:/root/.cache/trivy" \
              -v "$PWD:/work" -w /work \
              "$TRIVY" "$@" \
              --db-repository ghcr.io/aquasecurity/trivy-db:2 \
              --db-repository public.ecr.aws/aquasecurity/trivy-db:2
          }
          ok=0
          for attempt in 1 2 3; do
            if scan image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
                 --format json --output /work/trivy-image.json ai-reliability-gateway:ci 2> trivy.err; then
              ok=1; break
            fi
            echo "Trivy attempt $attempt failed, retrying"; sleep $((attempt * 20))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error title=Trivy scanner error::$(grep -E 'FATA|ERROR' trivy.err | tail -n 3 | cut -c1-600 | tr '\n' ' ')"
            exit 1
          fi
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-image.json)
          echo "HIGH/CRITICAL fixable vulnerabilities: $count"
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) [\($t)]"' trivy-image.json \
            | head -n 10 | while read -r line; do echo "::error title=Trivy finding::$line"; done
          [ "$count" -eq 0 ]
      - name: Scan IaC and manifests for misconfigurations
        # Report-only: findings are reviewed, see docs/security.md
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.57.1 \
            config --severity HIGH,CRITICAL --exit-code 0 projects/05-ai-reliability-platform
      - name: Log in to GHCR (release tags only)
        if: startsWith(github.ref, 'refs/tags/ai-reliability-platform-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        if: startsWith(github.ref, 'refs/tags/ai-reliability-platform-v')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_REPO }}/ai-reliability-gateway
      - name: Push release image with provenance and SBOM
        if: startsWith(github.ref, 'refs/tags/ai-reliability-platform-v')
        uses: docker/build-push-action@v7
        with:
          context: projects/05-ai-reliability-platform
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
