name: 00 - Supply chain guard

# Runs on every change to the pinning surface. Dependabot has twice opened pull requests that
# would turn a commit SHA back into a mutable tag, because the branch was cut before the pins
# landed; this makes that impossible to merge by accident.
on:
  push:
    branches: [main, staging]
    paths:
      - ".github/workflows/**"
      - "**/requirements*.txt"
      - "scripts/check_supply_chain.py"
      - "scripts/test_check_supply_chain.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/requirements*.txt"
      - "scripts/check_supply_chain.py"
      - "scripts/test_check_supply_chain.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Actions and dependencies are pinned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Every action is SHA-pinned, every dependency is ==
        run: python3 -I scripts/check_supply_chain.py
      - name: The guard itself still catches the regressions it exists for
        working-directory: scripts
        run: python3 -m unittest test_check_supply_chain -v
