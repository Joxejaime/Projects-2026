name: 06 - Self-service platform

# Monorepo workflow: runs only when this project (or this file) changes.
on:
  push:
    branches: [main, staging]
    paths:
      - "projects/06-self-service-platform/**"
      - ".github/workflows/06-self-service-platform.yml"
  pull_request:
    paths:
      - "projects/06-self-service-platform/**"
      - ".github/workflows/06-self-service-platform.yml"

permissions:
  contents: read

concurrency:
  group: self-service-platform-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/06-self-service-platform

jobs:
  test:
    name: Lint, tests and golden path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt ruff==0.17.3
      - run: ruff check . && ruff format --check .
      - run: python -m unittest discover -s tests -t . -v

  golden-path-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Scaffold, validate, and test a service for each tier
        run: |
          for tier in critical standard best-effort; do
            python -m platformctl new "demo-$tier" --owner team-demo --tier "$tier" --out "/tmp/demo-$tier"
            python -m platformctl validate "/tmp/demo-$tier" --strict
            (cd "/tmp/demo-$tier" && python -m unittest discover -s tests -t .)
          done
      - name: Non-compliant example must fail validation
        run: "! python -m platformctl validate examples/non-compliant/legacy-batch"

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - name: Validate module
        working-directory: projects/06-self-service-platform/terraform/modules/service-environment
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate generated environments
        working-directory: projects/06-self-service-platform/infra/services
        run: terraform init -backend=false -input=false && terraform validate
