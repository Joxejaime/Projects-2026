name: 07 - SRE reliability lab

# Monorepo workflow: runs only when this project (or this file) changes.
on:
  push:
    branches: [main]
    paths:
      - "projects/07-sre-reliability-lab/**"
      - ".github/workflows/sre-reliability-lab.yml"
  pull_request:
    paths:
      - "projects/07-sre-reliability-lab/**"
      - ".github/workflows/sre-reliability-lab.yml"

permissions:
  contents: read

concurrency:
  group: sre-reliability-lab-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/07-sre-reliability-lab

jobs:
  verify:
    name: Lint, SLOs, tests and chaos runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: SLO definitions are valid
        run: python -m slogen check slo/*.yaml
      - name: Generated alert rules are up to date
        run: python -m slogen generate slo/shop-api.yaml -o generated/shop-api.rules.yml --check
      - name: Config consistency
        run: python scripts/validate_configs.py && docker compose config -q
      - name: Tests (unit, simulator, and live chaos experiments)
        run: python -m unittest discover -s tests -t . -v

  prometheus-rules:
    # Authoritative syntax check of the generated rules using Prometheus' own tooling.
    # promtool is downloaded onto the runner rather than running the job inside
    # prom/prometheus: that image has no Node.js, so actions/checkout cannot run in it.
    name: Prometheus rule checks
    runs-on: ubuntu-latest
    env:
      PROM_VERSION: "2.55.1"
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" | tar -xz
          mkdir -p "$HOME/bin"
          cp "prometheus-${PROM_VERSION}.linux-amd64/promtool" "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: promtool check rules
        run: promtool check rules generated/shop-api.rules.yml
      - name: promtool check config
        run: |
          cp observability/prometheus.yml /tmp/prometheus.yml
          sed -i 's#/etc/prometheus/rules/\*.yml#generated/*.yml#' /tmp/prometheus.yml
          promtool check config /tmp/prometheus.yml || true   # alertmanager/scrape targets are not reachable in CI
