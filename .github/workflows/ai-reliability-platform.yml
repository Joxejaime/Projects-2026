name: ai-reliability-platform

# Monorepo workflow: runs only when this project (or this file) changes.
# Release: push a tag like ai-reliability-platform-v0.1.0 to publish the image to GHCR.
on:
  push:
    branches: [main]
    tags: ["ai-reliability-platform-v*.*.*"]
    paths:
      - "projects/ai-reliability-platform/**"
      - ".github/workflows/ai-reliability-platform.yml"
  pull_request:
    paths:
      - "projects/ai-reliability-platform/**"
      - ".github/workflows/ai-reliability-platform.yml"

permissions:
  contents: read

concurrency:
  group: ai-reliability-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-reliability-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tooling
        run: pip install ruff pyyaml
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate config files (rules, dashboards, k8s hardening)
        run: python scripts/validate_configs.py
      - name: Validate compose file
        run: docker compose config -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-reliability-platform/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  image:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (loaded locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: projects/ai-reliability-platform
          load: true
          tags: ai-reliability-gateway:ci
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-reliability-gateway:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan IaC and manifests for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: projects/ai-reliability-platform
          severity: HIGH,CRITICAL
          exit-code: "0" # report-only: findings are reviewed, see docs/security.md
      - name: Log in to GHCR (release tags only)
        if: startsWith(github.ref, 'refs/tags/ai-reliability-platform-v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        if: startsWith(github.ref, 'refs/tags/ai-reliability-platform-v')
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/ai-reliability-gateway
      - name: Push release image with provenance and SBOM
        if: startsWith(github.ref, 'refs/tags/ai-reliability-platform-v')
        uses: docker/build-push-action@v7
        with:
          context: projects/ai-reliability-platform
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
