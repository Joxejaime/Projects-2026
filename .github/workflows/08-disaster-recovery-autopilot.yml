name: 08 - Disaster recovery autopilot

# Monorepo workflow: runs only when this project (or this file) changes.
on:
  push:
    branches: [main, staging]
    paths:
      - "projects/08-disaster-recovery-autopilot/**"
      - ".github/workflows/08-disaster-recovery-autopilot.yml"
  pull_request:
    paths:
      - "projects/08-disaster-recovery-autopilot/**"
      - ".github/workflows/08-disaster-recovery-autopilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disaster-recovery-autopilot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/08-disaster-recovery-autopilot

jobs:
  verify:
    name: Lint, playbooks, tests and drills
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Make sure PostgreSQL server binaries are present
        # ubuntu-latest ships PostgreSQL (stopped); the tests start their own throwaway server from the binaries.
        working-directory: .
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
          fi
          ls /usr/lib/postgresql/*/bin/initdb
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Playbooks are valid
        run: python -m drpilot check
      - name: Tests (unit, real-PostgreSQL integration, all three drills)
        run: python -m pytest -v
      - name: Drills, with their postmortem drafts kept
        run: python -m drpilot drill --scenario all --out "$RUNNER_TEMP/postmortems"
      - name: Replay a sample Alertmanager incident
        run: python -m drpilot replay examples/replica-lag-firing.json examples/replica-lag-resolved.json --state "$RUNNER_TEMP/state" --postmortems "$RUNNER_TEMP/postmortems"
      - name: Upload the postmortem drafts this run generated
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postmortem-drafts
          path: ${{ runner.temp }}/postmortems
          if-no-files-found: warn

  terraform:
    name: Backup bucket module (fmt, validate, TFLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.13.0
          terraform_wrapper: false
      - name: Format check
        run: terraform fmt -check -diff
        working-directory: projects/08-disaster-recovery-autopilot/infra/backup-bucket
      - name: Init (no backend) and validate
        working-directory: projects/08-disaster-recovery-autopilot/infra/backup-bucket
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          # Without this the action installs the LATEST tflint, so the binary floats day to day
          # even though the action itself is SHA-pinned. It must stay compatible with the aws
          # ruleset version in .tflint.hcl.
          tflint_version: v0.64.0
      - name: TFLint
        working-directory: projects/08-disaster-recovery-autopilot/infra/backup-bucket
        run: |
          tflint --init
          tflint --minimum-failure-severity=warning

  prometheus-rules:
    # promtool is downloaded onto the runner rather than running the job inside prom/prometheus:
    # that image has no Node.js, so actions/checkout cannot run in it.
    name: Prometheus rule checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROM_VERSION: "2.55.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install promtool
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" | tar -xz
          mkdir -p "$HOME/bin"
          cp "prometheus-${PROM_VERSION}.linux-amd64/promtool" "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: promtool check rules
        run: promtool check rules observability/alert-rules.yml
