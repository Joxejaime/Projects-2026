version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates travel together; a major update gets its own pull request,
      # so one breaking action cannot hold back the rest.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /projects/01-secure-cicd-pipeline
    target-branch: staging
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /projects/02-aws-terraform-platform/envs/dev
    target-branch: staging
    schedule:
      interval: weekly
    ignore:
      # The v6 bump failed this project's CI checks. Move to 6.x as a deliberate migration, not a bot PR.
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directory: /projects/02-aws-terraform-platform/envs/prod
    target-branch: staging
    schedule:
      interval: weekly
    ignore:
      # The v6 bump failed this project's CI checks. Move to 6.x as a deliberate migration, not a bot PR.
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /projects/05-ai-reliability-platform
    target-branch: staging
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /projects/05-ai-reliability-platform/terraform
    target-branch: staging
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /projects/06-self-service-platform/terraform/modules/service-environment
    target-branch: staging
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /projects/07-sre-reliability-lab
    target-branch: staging
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /projects/06-self-service-platform
    target-branch: staging
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /projects/08-disaster-recovery-autopilot
    target-branch: staging
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /projects/08-disaster-recovery-autopilot/infra/backup-bucket
    target-branch: staging
    schedule:
      interval: weekly
