# Apply with:  kubectl apply -f k8s/        (replace OWNER and the image tag first)
apiVersion: v1
kind: Namespace
metadata:
  name: ai-gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: ai-gateway
data:
  GATEWAY_LOG_LEVEL: "INFO"
  GATEWAY_BREAKER_RECOVERY_TIMEOUT: "15"
  GATEWAY_RATE_LIMIT_RPS: "50"
  GATEWAY_RATE_LIMIT_BURST: "100"
  GATEWAY_SHUTDOWN_GRACE: "5"
  # GATEWAY_ADMIN_TOKEN is intentionally absent: admin/fault-injection routes stay disabled.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ai-gateway
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: ai-reliability-platform}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: ai-reliability-platform}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: gateway}
      containers:
        - name: gateway
          image: ghcr.io/OWNER/ai-reliability-platform:0.1.0   # pinned tag, never :latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: gateway-config}}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: {command: ["python", "-c", "import time; time.sleep(5)"]}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ai-gateway
  labels: {app.kubernetes.io/name: gateway}
spec:
  selector: {app.kubernetes.io/name: gateway}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: ai-gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: ai-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
---
# Default-deny, then allow only what the gateway needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gateway}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
  egress:
    - ports:            # DNS
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:            # real LLM provider APIs over TLS (mock providers need none)
        - {port: 443, protocol: TCP}
