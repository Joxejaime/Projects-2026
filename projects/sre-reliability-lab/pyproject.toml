[project]
name = "sre-reliability-lab"
version = "0.1.0"
description = "SLOs as code, burn-rate alert generation, incident simulation and chaos experiments"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "N", "E501"]  # long strings in test fixtures are clearer unwrapped
"chaos/*" = ["S"]
"demo/*" = ["S"]
"scripts/*" = ["S"]
