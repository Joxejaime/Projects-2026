apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: release-tracker
spec:
  ingressClassName: nginx
  rules:
    - host: release-tracker.example.com # patched per environment
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: release-tracker
                port:
                  name: http
