apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: release-tracker-dev
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ghcr.io/joxejaime/release-tracker
    newTag: sha-0000000000000000000000000000000000000000 # bumped by the promote workflow
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: release-tracker
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: Deployment
      name: release-tracker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: PodDisruptionBudget
      name: release-tracker
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: Ingress
      name: release-tracker
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: release-tracker.dev.example.com
