apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: release-tracker-prod
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ghcr.io/joxejaime/release-tracker
    newTag: sha-0000000000000000000000000000000000000000 # promoted from dev via pull request
patches:
  - target:
      kind: Deployment
      name: release-tracker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
  - target:
      kind: HorizontalPodAutoscaler
      name: release-tracker
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: PodDisruptionBudget
      name: release-tracker
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target:
      kind: Ingress
      name: release-tracker
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: release-tracker.example.com
