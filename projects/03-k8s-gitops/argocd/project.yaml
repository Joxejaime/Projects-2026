apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: release-tracker
  namespace: argocd
spec:
  description: release-tracker environments
  sourceRepos:
    - https://github.com/Joxejaime/devops-portfolio.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: release-tracker-dev
    - server: https://kubernetes.default.svc
      namespace: release-tracker-prod
  # Namespaces are created by the overlays, so Namespace is the only cluster-scoped
  # kind this project may manage. Everything else cluster-wide is denied.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Only the kinds this application renders. Anything else (Role, RoleBinding, Secret, ...) in the
  # overlay is refused at sync time, so a pull request cannot widen permissions through the manifests.
  namespaceResourceWhitelist:
    - {group: "", kind: ServiceAccount}
    - {group: "", kind: Service}
    - {group: apps, kind: Deployment}
    - {group: autoscaling, kind: HorizontalPodAutoscaler}
    - {group: policy, kind: PodDisruptionBudget}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: networking.k8s.io, kind: Ingress}
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
  orphanedResources:
    warn: true
