# Alerts that drpilot has playbooks for. The probe_success series comes from a blackbox exporter
# probing the notes service's /healthz; the labels here are what playbooks match on.
groups:
  - name: drpilot-recoverable
    rules:
      - alert: NotesUnhealthy
        expr: probe_success{job="notes-health"} == 0
        for: 1m
        labels:
          severity: page
          service: notes
        annotations:
          summary: Notes service health check failing
          description: "/healthz has failed for 1 minute; the data file may be corrupt or missing."
          runbook_url: https://github.com/Joxejaime/Projects-2026/blob/main/projects/08-disaster-recovery-autopilot/docs/runbooks/notes-unhealthy.md
      - alert: KubeDeploymentUnavailable
        expr: kube_deployment_status_replicas_unavailable > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.deployment }} has unavailable replicas in {{ $labels.namespace }}"
          description: "Replicas have been unavailable for 10 minutes, typically a bad rollout that crash-loops."
