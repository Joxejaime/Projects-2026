# Kubernetes recovery by rolling back project 03's Deployment when 04's CrashLooping alert fires for release-tracker
# in the dev environment. Argo CD may try to sync the bad revision again, so this buys time: the real fix still
# has to land in Git.
#
# NOT RUN against a cluster. Validated by `drpilot check` and exercised in tests with a stub `kubectl`
# (argument order only).
#
# Environment: K8S_NAMESPACE (03's dev overlay uses release-tracker-dev).
name: k8s-rollback-crashloop
match:
  alertname: CrashLooping
  service: release-tracker
  environment: dev
max_attempts: 1
objectives:
  rto_seconds: 600
steps:
  - name: Roll back to the previous ReplicaSet
    run: ["kubectl", "--namespace", "{env.K8S_NAMESPACE}", "rollout", "undo", "deployment/release-tracker"]
    timeout: 30
  - name: Wait for the rollback to become available
    run: ["kubectl", "--namespace", "{env.K8S_NAMESPACE}", "rollout", "status", "deployment/release-tracker", "--timeout=300s"]
    timeout: 320
