# Recovery for a corrupted or missing notes data file: restore the newest verified snapshot,
# make the service load it, then require consecutive healthy probes before calling it recovered.
name: notes-restore-from-snapshot
match:
  alertname: NotesUnhealthy
  service: notes
max_attempts: 2
objectives:
  rto_seconds: 120   # impact start to verified recovery
  rpo_seconds: 900   # snapshots run every 15 minutes, so at most 15 minutes of writes may be lost
steps:
  - name: Restore newest verified snapshot
    run: ["{python}", "{playbook_dir}/../demo/backup.py", "restore", "--data", "{env.NOTES_DATA}", "--dir", "{env.NOTES_BACKUPS}"]
    timeout: 30
  - name: Reload service from disk
    http:
      method: POST
      url: "{env.NOTES_URL}/admin/reload"
      bearer_token_env: NOTES_ADMIN_TOKEN   # secret read from the environment, never stored here
      expect_status: 200
    timeout: 10
verify:
  url: "{env.NOTES_URL}/healthz"
  expect_status: 200
  successes: 3
  interval_seconds: 0.5
  timeout_seconds: 20
